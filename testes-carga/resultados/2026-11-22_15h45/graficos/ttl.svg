<svg xmlns="http://www.w3.org/2000/svg" width="960" height="374" viewBox="0 0 960 374" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Taxa de acerto do cache ao longo do tempo, por TTL</title>
<desc id="descricao">Cache esvaziado no instante 0; média das repetições, em janelas de 5 s. Séries: TTL 5 s, TTL 30 s, TTL 120 s, TTL 600 s. Eixo x: segundos desde o esvaziamento (5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60).</desc>
<style>
svg { --fundo: #fcfcfb; --tinta1: #0b0b0b; --tinta2: #52514e; --tinta3: #898781;
      --grade: #e1e0d9; --eixo: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) {
  svg { --fundo: #1a1a19; --tinta1: #f0efec; --tinta2: #c3c2b7; --tinta3: #898781;
        --grade: #2c2c2a; --eixo: #383835; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; }
}
.fundo { fill: var(--fundo); }
.grade { stroke: var(--grade); stroke-width: 1; }
.eixo { stroke: var(--eixo); stroke-width: 1; }
.t1 { fill: var(--tinta1); }
.t2 { fill: var(--tinta2); }
.t3 { fill: var(--tinta3); }
.num { font-variant-numeric: tabular-nums; }
.linha { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ponto { stroke: var(--fundo); stroke-width: 2; }
.c1 .linha { stroke: var(--s1); } .c1 .ponto { fill: var(--s1); }
.c2 .linha { stroke: var(--s2); } .c2 .ponto { fill: var(--s2); }
.c3 .linha { stroke: var(--s3); } .c3 .ponto { fill: var(--s3); }
.c4 .linha { stroke: var(--s4); } .c4 .ponto { fill: var(--s4); }
</style>
