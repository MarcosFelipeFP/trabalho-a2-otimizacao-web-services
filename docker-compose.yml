# Biblioteca: API em Python (FastAPI), cache Redis e o banco PostgreSQL no Supabase.
#
#   docker compose up -d --build     sobe o cache e a API, que usa o banco indicado no .env
#   docker compose down              para tudo (os dados ficam no Supabase)
#
# O banco: as variáveis PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE e PGSSLMODE do .env (modelo
# em .env.exemplo) apontam para o projeto no Supabase. Sem o .env, a API usa o PostgreSQL local do
# perfil "banco-local":
#   docker compose --profile banco-local up -d --build
#
# Outras variáveis opcionais (no ambiente ou no .env): CACHE_TTL_SEGUNDOS, WORKERS,
# CONEXOES_POR_WORKER, PORTA_API, PORTA_BANCO e PORTA_CACHE.
name: biblioteca

x-banco: &banco
  PGHOST: ${PGHOST:-banco}
  PGPORT: ${PGPORT:-5432}
  PGUSER: ${PGUSER:-biblioteca}
  PGPASSWORD: ${PGPASSWORD:-biblioteca}
  PGDATABASE: ${PGDATABASE:-biblioteca}
  PGSSLMODE: ${PGSSLMODE:-prefer}

services:
  # PostgreSQL local, opcional: alternativa ao Supabase para reproduzir os experimentos sem rede.
  # Na primeira subida ele roda banco/01-esquema.sql, 02-dados.sql e 03-indices.sql sozinho.
  banco:
    image: postgres:17
    container_name: biblioteca-banco
    profiles: ["banco-local"]
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    command:
      - postgres
      # a base inteira cabe na memória do banco, para as medições não dependerem do disco
      - -c
      - shared_buffers=256MB
      # estatísticas por comando SQL (pg_stat_statements)
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
    ports:
      - "${PORTA_BANCO:-5432}:5432"
    volumes:
      - ./banco:/docker-entrypoint-initdb.d:ro
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      # -h força TCP: durante a carga inicial o servidor temporário só escuta no socket local
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 3s
      retries: 60

  cache:
    image: redis:8.10-alpine
    container_name: biblioteca-cache
    # Uso exclusivo como cache: nada é gravado em disco e, se a memória acabar, saem as chaves
    # usadas há mais tempo.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${PORTA_CACHE:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    container_name: biblioteca-api
    environment:
      <<: *banco
      URL_CACHE: redis://cache:6379/0
      # tempo de vida das fichas de livro no cache (seção 3.4 do enunciado)
      CACHE_TTL_SEGUNDOS: ${CACHE_TTL_SEGUNDOS:-600}
      # processos da API e conexões com o banco em cada um. O pooler do Supabase aceita 15
      # conexões simultâneas por usuário: 4 x 3 = 12 deixa folga para o psql dos experimentos.
      WORKERS: ${WORKERS:-4}
      CONEXOES_POR_WORKER: ${CONEXOES_POR_WORKER:-3}
    ports:
      - "${PORTA_API:-8000}:8000"
    depends_on:
      banco:
        condition: service_healthy
        required: false
      cache:
        condition: service_healthy

  # Cliente psql, para criar e popular o banco e para os experimentos. Não sobe com "up":
  #   docker compose run --rm psql -f /banco/01-esquema.sql -f /banco/02-dados.sql -f /banco/03-indices.sql
  #   docker compose run --rm psql -c "SELECT count(*) FROM emprestimo"
  psql:
    image: postgres:17
    profiles: ["ferramentas"]
    environment:
      <<: *banco
    volumes:
      - ./banco:/banco:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1"]

  # Gerador de carga (Grafana k6), na mesma rede da API. Não sobe com "docker compose up":
  #   docker compose run --rm k6 run k6/cache.js -e VERSAO=com-cache-quente
  # Painel web ao vivo em http://localhost:5665:
  #   docker compose run --rm --service-ports -e K6_WEB_DASHBOARD=true k6 run k6/cache.js
  k6:
    image: grafana/k6:2.3.0
    profiles: ["carga"]
    working_dir: /testes
    environment:
      BASE_URL: http://api:8000
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
    volumes:
      - ./testes-carga:/testes
    ports:
      - "5665:5665"

volumes:
  dados-banco:
